name: Release packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build:
    # Publishing a versioned GitHub Release is the only automatic trigger.
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-windows
          - runner: macos-15-intel
            target: darwin-amd64
          - runner: macos-15
            target: darwin-arm64
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[vV][0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "Expected a version tag such as v1.0 or v1.0.0-rc.1" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - name: Build the embedded viewer
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Build binaries
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release-bin
          if [[ "$BUILD_TARGET" == linux-windows ]]; then
            for target in linux-amd64 linux-arm64 windows-amd64 windows-arm64; do
              os="${target%-*}"
              arch="${target#*-}"
              name="golangtools-$target"
              if [[ "$os" == windows ]]; then name+='.exe'; fi
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
                go build -trimpath -ldflags='-s -w' -o "release-bin/$name" .
            done
            ./release-bin/golangtools-linux-amd64 help > release-help.txt
            grep -q 'filesystem inspect' release-help.txt
          else
            arch="${BUILD_TARGET#darwin-}"
            if [[ "$(go env GOHOSTOS)" != darwin || "$(go env GOHOSTARCH)" != "$arch" ]]; then
              echo "A native macOS $arch runner is required for CGO" >&2
              exit 1
            fi
            name="golangtools-$BUILD_TARGET"
            GOOS=darwin GOARCH="$arch" CGO_ENABLED=1 \
              go build -trimpath -ldflags='-s -w' -o "release-bin/$name" .
            codesign -s - --entitlements debugger.entitlements.plist --force "release-bin/$name"
            codesign --verify --strict "release-bin/$name"
            "./release-bin/$name" help > release-help.txt
            grep -q 'filesystem inspect' release-help.txt
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-bin-${{ matrix.target }}
          path: release-bin/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Package and upload
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-bin-*
          path: release-bin
          merge-multiple: true
      - name: Create release archives and checksums
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./scripts/package-release.sh "$RELEASE_TAG" release-bin release-packages
      - name: Upload assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-packages/* --clobber
